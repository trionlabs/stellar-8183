name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "8183"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/stellar-cli@v27.0.0
        with:
          version: 27.0.0
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: ./scripts/verify-release.sh
      - run: ./scripts/release-build.sh
      - name: Upload optimized Wasm
        uses: actions/upload-artifact@v4
        with:
          name: optimized-wasm
          path: artifacts/release/*.wasm
          if-no-files-found: error

  typescript:
    name: TypeScript SDK and demo
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: optimized-wasm
          path: artifacts/release
      - uses: stellar/stellar-cli@v27.0.0
        with:
          version: 27.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm bindings:check
      - run: pnpm check
      - name: Install browser for Console integration tests
        run: pnpm --filter @trionlabs/8183-console exec playwright install --with-deps chromium
      - name: Exercise the Console in Chromium
        run: pnpm console:e2e
      - name: Upload Console static build
        uses: actions/upload-artifact@v4
        with:
          name: agent-commerce-console
          path: apps/console/dist
          if-no-files-found: error

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the host-only audit exception boundary
        run: node scripts/check-wasm-dependencies.mjs
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Native Soroban test host only; guarded above and reviewed in docs.
          ignore: RUSTSEC-2026-0387

  javascript-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose

  audit:
    name: Dependency and secret audit
    needs: [rust-audit, javascript-audit, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every security check to pass
        env:
          RUST_AUDIT_RESULT: ${{ needs.rust-audit.result }}
          JAVASCRIPT_AUDIT_RESULT: ${{ needs.javascript-audit.result }}
          SECRET_SCAN_RESULT: ${{ needs.secrets.result }}
        run: |
          printf '## Security checks\n\nCommit: `%s`\n\n| Check | Result |\n| --- | --- |\n| Rust dependencies | %s |\n| JavaScript dependencies | %s |\n| Secrets | %s |\n' \
            "$GITHUB_SHA" "$RUST_AUDIT_RESULT" "$JAVASCRIPT_AUDIT_RESULT" "$SECRET_SCAN_RESULT" \
            >> "$GITHUB_STEP_SUMMARY"
          test "$RUST_AUDIT_RESULT" = success
          test "$JAVASCRIPT_AUDIT_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
