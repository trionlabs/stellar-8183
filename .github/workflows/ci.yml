name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "8183"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/stellar-cli@v27.0.0
        with:
          version: 27.0.0
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: ./scripts/verify-release.sh
      - run: ./scripts/release-build.sh
      - name: Upload optimized Wasm
        uses: actions/upload-artifact@v4
        with:
          name: optimized-wasm
          path: artifacts/release/*.wasm
          if-no-files-found: error

  typescript:
    name: TypeScript SDK and demo
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: optimized-wasm
          path: artifacts/release
      - uses: stellar/stellar-cli@v27.0.0
        with:
          version: 27.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm bindings:check
      - run: pnpm check

  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
