[workspace]
resolver = "2"
members = [
  "contracts/interfaces",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/trionlabs/stellar-8183"

[workspace.dependencies]
soroban-sdk = "27.0.3"

[profile.release]
codegen-units = 1
debug = 0
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
